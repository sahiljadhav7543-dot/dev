<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>

body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    overflow:hidden;
}

/* Story container */
.story{
    width:100%;
    height:100vh;
    position:absolute;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    padding:20px;
    transition:0.7s;
}

/* Different Screens */
#s1{ background: linear-gradient(#ff758c,#ac0c4f); }
#s2{ background: linear-gradient(#ff9a9e,#fad0c4); }
#s3{ background: linear-gradient(#ff6a88,#99031e); }
#s4{ background: linear-gradient(#ff4b7d,#ff758c); }

h1{
    font-size:35px;
    animation: fade 1.5s ease;
}

p{
    font-size:22px;
    margin-top:15px;
    animation: fade 2s ease;
}

@keyframes fade{
    from{opacity:0; transform:translateY(40px);}
    to{opacity:1; transform:translateY(0);}
}

/* Floating hearts */
.heart{
    position:fixed;
    bottom:-20px;
    font-size:20px;
    animation:float 5s linear infinite;
}

@keyframes float{
    0%{ transform:translateY(0); opacity:1;}
    100%{ transform:translateY(-100vh); opacity:0;}
}

/* Proposal Buttons */
.btn{
    margin:15px;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
}

.yes{ background:white; color:#ff4b7d; }
.no{ background:black; color:white; }

</style>
</head>

<body>

<!-- Screen 1 -->
<div class="story" id="s1">
    <div>
        <h1>Hey My Love Sonali❤️</h1>
        <p>Tap Anywhere...</p>
    </div>
</div>

<!-- Screen 2 -->
<div class="story" id="s2" style="display:none;">
    <div>
        <h1>You Are Special 💞</h1>
        <p>You make my world beautiful</p>
        <p>Tap Anywhere...</p>
    </div>
</div>

<!-- Screen 3 -->
<div class="story" id="s3" style="display:none;">
    <div>
        <h1>I Love Every Moment</h1>
        <p>Spent with you ❤️</p>
        <p>Tap Anywhere...</p>
    </div>
</div>

<!-- Screen 4 Proposal -->
<div class="story" id="s4" style="display:none;">
    <div>
        <h1>Will You Be Mine Forever Sonali? 💍</h1>

        <button class="btn yes" onclick="yesLove()">YES ❤️</button>
        <button class="btn no" onclick="moveNo()">NO 😜</button>
    </div>
</div>

<script>

let screens = ["s1","s2","s3","s4"];
let current = 0;

/* Tap anywhere to next screen */
document.body.addEventListener("click",()=>{
    if(current < screens.length-1){
        document.getElementById(screens[current]).style.display="none";
        current++;
        document.getElementById(screens[current]).style.display="flex";
    }
});

/* YES Button */
function yesLove(){
    alert("Yayyyy ❤️ I Love You Forever 💞");
}

/* NO Button moves */
function moveNo(){
    event.target.style.position="absolute";
    event.target.style.top=Math.random()*80+"%";
    event.target.style.left=Math.random()*80+"%";
}

/* Floating Hearts */
function heart(){
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),5000);
}
setInterval(heart,400);

</script> 

</body>
</html>
